[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "role-scopes"
version = "0.1.0"
description = "Multi-actor authorization for Django backends: declarative policies, queryset scoping and object ownership checks."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Shipmind Labs", email = "hello@shipmindlabs.com" }]
keywords = ["django", "authorization", "permissions", "rbac", "scoping"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Framework :: Django",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Typing :: Typed",
]
dependencies = ["django>=4.2"]

[project.urls]
Homepage = "https://github.com/shipmindlabs/role-scopes"
Source = "https://github.com/shipmindlabs/role-scopes"
Issues = "https://github.com/shipmindlabs/role-scopes/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/role_scopes"]
